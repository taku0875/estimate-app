<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSUMIKI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Orbitron:wght@700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3b4533"/><rect x="5" y="17" width="10" height="10" rx="2" fill="#a9d46a"/><rect x="17" y="17" width="10" height="10" rx="2" fill="#a9d46a"/><rect x="11" y="5" width="10" height="10" rx="2" fill="#a9d46a"/></svg>
      <div><b>TSUMIKI</b></div>
    </div>
    <nav id="nav">
      <a href="#property" class="on"><i>1</i><span>物件情報</span></a>
      <a href="#works"><i>2</i><span>工事の種類</span></a>
      <a href="#detail"><i>3</i><span>内訳の確認</span></a>
    </nav>
  </aside>

  <div class="content">
    <header class="top">
      <div class="crumb"><b>新規の見積依頼</b></div>
    </header>
    <p class="banner" id="sampleNote" hidden>サンプル版です。入力内容は保存されません。</p>

    <main>
      <section class="card" id="property">
        <div class="card-h"><h2>物件情報</h2></div>
        <div class="grid">
          <div class="wide pair">
            <span class="gl">お施主様名</span>
            <div class="two">
              <label>法人の名称<input data-k="customer_company" placeholder="例: 株式会社VIVANT"></label>
              <label>個人の名前<input data-k="customer_name" placeholder="例: 乃木憂助"></label>
            </div>
          </div>
          <label class="wide">物件所在地<input data-k="address" placeholder="例: 島根県出雲市…"></label>
          <label>見積提出期限<input type="date" data-k="due_date"></label>
        </div>

        <label class="wide block">備考・特記事項（お客様への説明事項）<textarea data-k="remarks" rows="3" placeholder="搬入経路、工事時間の制限、既存設備の状況など"></textarea></label>
      </section>

      <section class="card" id="works">
        <div class="card-h"><h2>工事の種類</h2><span class="sub-h">選択した種類に応じて、Excelの出力形式が替わります。</span></div>
        <div class="fmt">
          <div class="seg" id="formats"></div>
        </div>

        <div class="plumb" id="plumbing" hidden>
          <div class="plumb-h"><b>水回りの範囲</b><span>選んだ設備の工事だけが、給排水設備工事・住宅設備工事などの内訳に出ます</span></div>
          <h4 class="sub">設備を個別に選ぶ</h4>
          <div class="fx" id="fixtures"></div>
        </div>

        <div id="cats" class="cats"></div>
      </section>

      <section class="card" id="detail">
        <div class="card-h"><h2>内訳の確認</h2></div>
        <div id="detailBody"></div>
      </section>
    </main>
  </div>

  <aside class="summary" id="summary">
    <div class="sum-body">
      <h4>出力の内容</h4>
      <dl>
        <div><dt>工事の種類</dt><dd id="sType">—</dd></div>
        <div id="sFixRow" hidden><dt>水回りの設備</dt><dd id="sPlumb">—</dd></div>
        <div><dt>工事</dt><dd id="sWorks">—</dd></div>
        <div><dt>内訳</dt><dd id="sItems">—</dd></div>
        <div><dt>数量未入力</dt><dd id="sTodo">—</dd></div>
      </dl>
    </div>
    <div class="sum-actions">
      <span id="status"></span>
      <button id="saveCatalog" class="ghost" title="今の項目構成を次回以降のひな形として保存">ひな形として保存</button>
      <button id="export" class="primary">Excelを出力</button>
    </div>
  </aside>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
